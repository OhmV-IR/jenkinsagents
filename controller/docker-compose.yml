services:
  jenkins-controller:
    image: registry.ohmvir.dev/jenkins-controller:latest
    container_name: jenkins-controller
    restart: unless-stopped
    ports:
      - "9090:9090"   # Jenkins Web UI (JENKINS_OPTS --httpPort in controller/Dockerfile); agents connect over WebSocket on this port too
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    volumes:
      - jenkins_data:/var/jenkins_home
      # If you want to use the seed data from your backup:
      # - ./jenkins-backup:/usr/share/jenkins/ref:ro
    networks:
      - jenkins-net

volumes:
  jenkins_data:
    driver: local

networks:
  jenkins-net:
    driver: bridge
