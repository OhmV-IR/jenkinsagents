# Docker-in-docker agent. Needs the Sysbox runtime on the host (https://github.com/nestybox/sysbox),
# which lets the inner dockerd run without --privileged.
# AGENT_NAME and AGENT_SECRET come from .env (copy example.env).
services:
  jenkins-agent:
    image: registry.ohmvir.dev/jenkins-agent-linux:latest
    container_name: new-laptop-linux-container
    restart: unless-stopped
    runtime: sysbox-runc
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Environment Variables
    environment:
      JENKINS_URL: "https://jenkins.bgfamily.ca"
      AGENT_NAME: "${AGENT_NAME:?set AGENT_NAME in .env}"
      AGENT_SECRET: "${AGENT_SECRET:?set AGENT_SECRET in .env}"
      AGENT_WORKDIR: "/home/jenkins"
    volumes:
      - /opt/unrealengine:/opt/unrealengine:ro
